server:
  port: 7100
spring:
  application:
    name: service-sample
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/sample?characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai
  cloud:
    nacos:
      discovery:
        #namespace: 579e1018-46bd-40e2-8802-98f69d98f24e
        server-addr: 127.0.0.1:8848
        #endpoint: dev-xy-nacos.douxindata.com:80
      config:
        #namespace: 579e1018-46bd-40e2-8802-98f69d98f24e
        file-extension: yaml
        server-addr: 127.0.0.1:8848
        #server-addr: 192.168.0.50:8848,192.168.0.51:8848,192.168.0.52:8848
        shared-data-ids: public-database-config.yaml,public-redisson-config.yaml,public-redis-config.yaml,public-mongodb-config.yaml,public-oss-config.yaml,public-es-config.yaml
        refreshable-dataids: public-database-config.yaml,public-redisson-config.yaml,public-redis-config.yaml,public-mongodb-config.yaml,public-oss-config.yaml,public-es-config.yaml
        ext-config:
          - dataId: ${spring.application.name}-extconfig.yaml
            refresh: true

#nacos 配置隔离方法：通过 namespace
#   1.自定义 namespace, 在 nacos 控制台定义 namespace, 同时将配置拷贝到自定义 namespace
#   2.指定使用哪一个 namespace
#       spring:
#         cloud:
#           nacos:
#             discovery:
#               namespace: 579e1018-46bd-40e2-8802-98f69d98f24e
#             config:
#               namespace: 579e1018-46bd-40e2-8802-98f69d98f24e
#   3.每个开发者使用自己的 namespace
#       1).每一个 namespace 有自己的一套 config，同一服务名称注册时隶属于自己的 namespace
#       2).本地调试，直接请求本地机器节点
#       3).本地启动网关，无需修改路由，可以指定 namespace 也可以不指定
#       3).公共网关，无需修改路由，可以指定 namespace 也可以不指定
#
#nacos 配置隔离方法：修改 spring.application.name
#   1.修改 spring.application.name
#   2.增加修改后名称的配置文件, eg:
#       spring:
#         application:
#           name: service-sample      ##service-sample.yaml
#       spring:
#         application:
#           name: service-sample-ymz  ##service-sample-ymz.yaml
#   3.每个开发者注册的服务名称都是不同的
#       1).本地调试时，直接请求本地机器节点
#       2).本地启动网关，除非修改路由，否则找不到自定义名称的服务
#       3).公用网关，除非修改路由，否则找不到自定义名称的服务
